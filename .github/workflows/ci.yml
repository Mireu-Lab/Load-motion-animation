name: CI - Test & Build Verification

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-go:
    name: Go Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit Tests
        run: go test -v ./tests/...

      - name: Verify Go Build
        run: |
          mkdir -p bin
          go build -v -o bin/motion-parser ./cmd/motion-parser
          ./bin/motion-parser -input _sample/Sample_motion.bvh -export summary

  test-python:
    name: Python Test & Package Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go (for Go GIF engine integration)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Motion Engine Binary
        run: |
          mkdir -p bin
          go build -o bin/motion-parser ./cmd/motion-parser

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel

      - name: Run Python Unit Tests
        run: |
          PYTHONPATH=python python -m unittest tests/test_python_loader.py

      - name: Verify Python Package Build
        run: |
          python -m build python/
