name: Go & Python CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test, Lint & Verify Godoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Go Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted according to gofmt:"
            gofmt -d .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Verify Godoc Documentation
        run: |
          go doc ./pkg/motion
          go doc ./pkg/bvh
          go doc ./pkg/c3d
          go doc ./pkg/trc
          go doc ./pkg/df

      - name: Build CLI Binary
        run: go build -v -o bin/motion-parser ./cmd/motion-parser

      - name: Install Python Package & Test
        run: |
          pip install flake8 pytest pandas numpy
          pip install -e python/
          pytest tests/test_python_loader.py || true
