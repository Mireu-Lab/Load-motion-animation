name: CD - Tag Release & PyPI / Go-Doc Deployment

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify Tests & Build Before Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Go & Python Tests
        run: |
          go test -v ./tests/...
          PYTHONPATH=python python -m unittest tests/test_python_loader.py

  build-go-binaries:
    name: Cross-Compile Go Binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p release_dist
          
          # Linux amd64 & arm64
          GOOS=linux GOARCH=amd64 go build -o release_dist/motion-parser-linux-amd64 ./cmd/motion-parser
          GOOS=linux GOARCH=arm64 go build -o release_dist/motion-parser-linux-arm64 ./cmd/motion-parser
          
          # macOS amd64 & arm64
          GOOS=darwin GOARCH=amd64 go build -o release_dist/motion-parser-darwin-amd64 ./cmd/motion-parser
          GOOS=darwin GOARCH=arm64 go build -o release_dist/motion-parser-darwin-arm64 ./cmd/motion-parser
          
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -o release_dist/motion-parser-windows-amd64.exe ./cmd/motion-parser

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: release_dist/*

  publish-pypi:
    name: Publish Python Package to PyPI
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Source Distribution and Wheel
        run: |
          python -m build python/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

  create-github-release:
    name: Create GitHub Release & Go-Doc Registration
    needs: [build-go-binaries, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Go Binaries
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: release_dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Register & Update pkg.go.dev (Go Documentation)
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Updating pkg.go.dev documentation for tag ${TAG_NAME}..."
          curl -s "https://proxy.golang.org/github.com/Mireu-Lab/Load-motion-animation/@v/${TAG_NAME}.info" || true
