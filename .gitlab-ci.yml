# ==============================================================================
# GitLab CI/CD Pipeline Configuration
# Load-motion-animation: 3D/2D Motion Capture Parser & Pipeline Engine
# ==============================================================================

stages:
  - test
  - build
  - docs
  - release

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DEBIAN_FRONTEND: noninteractive

# Default pipeline execution rules
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Reusable cache configuration for Go modules and Python wheels
default:
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .go/pkg/mod/
      - .cache/pip/

# ------------------------------------------------------------------------------
# 1. TEST STAGE
# ------------------------------------------------------------------------------

# Go Test & Build Verification
test:go:
  stage: test
  image: golang:1.22
  before_script:
    - mkdir -p .go/pkg/mod
  script:
    - echo "=== Running Go Vet ==="
    - go vet ./...
    - echo "=== Running Go Unit Tests and Godoc Examples with Coverage ==="
    - go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out
    - echo "=== Verifying Go CLI Build ==="
    - mkdir -p bin
    - go build -v -o bin/motion-parser ./cmd/motion-parser
    - ./bin/motion-parser -input _sample/Sample_motion.bvh -export summary
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    name: "motion-parser-bin-${CI_COMMIT_SHORT_SHA}"
    paths:
      - bin/motion-parser
      - coverage.out
    expire_in: 1 week

# Python Test & Package Build Verification
test:python:
  stage: test
  image: python:3.11
  needs:
    - job: test:go
      artifacts: true
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install build setuptools wheel
  script:
    - echo "=== Running Python Unit Tests ==="
    - PYTHONPATH=python python -m unittest tests/test_python_loader.py
    - echo "=== Building Python Distribution Packages ==="
    - python -m build python/
  artifacts:
    name: "python-dist-${CI_COMMIT_SHORT_SHA}"
    paths:
      - python/dist/*
    expire_in: 1 week

# ------------------------------------------------------------------------------
# 2. BUILD STAGE (Cross-platform Go Binaries)
# ------------------------------------------------------------------------------

build:cross-platform:
  stage: build
  image: golang:1.22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - echo "=== Cross-compiling Motion Parser Binaries ==="
    - mkdir -p release_dist
    - GOOS=linux GOARCH=amd64 go build -v -o release_dist/motion-parser-linux-amd64 ./cmd/motion-parser
    - GOOS=linux GOARCH=arm64 go build -v -o release_dist/motion-parser-linux-arm64 ./cmd/motion-parser
    - GOOS=darwin GOARCH=amd64 go build -v -o release_dist/motion-parser-darwin-amd64 ./cmd/motion-parser
    - GOOS=darwin GOARCH=arm64 go build -v -o release_dist/motion-parser-darwin-arm64 ./cmd/motion-parser
    - GOOS=windows GOARCH=amd64 go build -v -o release_dist/motion-parser-windows-amd64.exe ./cmd/motion-parser
    - ls -lh release_dist/
  artifacts:
    name: "motion-parser-binaries-${CI_COMMIT_SHORT_SHA}"
    paths:
      - release_dist/*
    expire_in: 1 month

# ------------------------------------------------------------------------------
# 3. DOCS STAGE (Godoc Documentation & GitLab Pages)
# ------------------------------------------------------------------------------

# Verify Godoc generation during Merge Requests
verify:godoc:
  stage: docs
  image: golang:1.22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget
  script:
    - echo "=== Verifying Godoc Static Generation ==="
    - ./scripts/generate_godoc.sh test_public
    - rm -rf test_public

# Deploy Godoc Documentation to GitLab Pages
pages:
  stage: docs
  image: golang:1.22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget
  script:
    - echo "=== Generating Godoc Documentation for GitLab Pages ==="
    - ./scripts/generate_godoc.sh public
  artifacts:
    paths:
      - public
    expire_in: 30 days

# ------------------------------------------------------------------------------
# 4. RELEASE STAGE (GitLab Releases, PyPI & pkg.go.dev)
# ------------------------------------------------------------------------------

# Create GitLab Release with binary downloads
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
  needs:
    - job: build:cross-platform
      artifacts: true
  script:
    - echo "Publishing GitLab Release for tag $CI_COMMIT_TAG"
  release:
    name: "Release $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: "Automated release of Load-motion-animation $CI_COMMIT_TAG generated by GitLab CI/CD runner."

# Publish Python package to PyPI (optional, active when TWINE_PASSWORD secret is provided)
publish:pypi:
  stage: release
  image: python:3.11
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+/ && $TWINE_PASSWORD != null'
  needs:
    - job: test:python
      artifacts: true
  script:
    - pip install --upgrade twine
    - python -m twine upload python/dist/*
  allow_failure: true

# Register & Trigger Go Documentation Indexing (pkg.go.dev)
trigger:godoc-index:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+/
  script:
    - echo "Triggering Go proxy index for tag ${CI_COMMIT_TAG}..."
    - curl -s "https://proxy.golang.org/gitlab.com/${CI_PROJECT_PATH}/@v/${CI_COMMIT_TAG}.info" || true
  allow_failure: true
